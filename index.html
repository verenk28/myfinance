
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFinance</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px #0f172a12;
            max-width: 420px;
            margin: 20px;
        }
        h1 { color: #2563eb; }
        p { color: #64748b; }
    </style>
</head>
<body>
    <main class="card">
        <h1>MyFinance</h1>
        <p>Catatan keuangan pribadi dalam satu tempat.</p>
        <p>Website berhasil disiapkan.</p>
    </main>
</body>
</html>
